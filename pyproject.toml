[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agents"
version = "0.1.0"
description = "Autonomous AI agent with pluggable LLM backends"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.55.0",
    "black>=24.0",
    "pillow",
    "playwright>=1.40.0",
    "PyYAML>=6.0.2",
    "rich>=13.8.1",
]

[project.optional-dependencies]
images = ["requests"]
openai = ["openai"]
gemini = ["google-genai"]
cerebras = ["cerebras_cloud_sdk"]
search = ["ddgs"]
mcp = ["mcp>=1.0.0"]
all = ["requests", "openai", "google-genai", "cerebras_cloud_sdk", "ddgs", "mcp>=1.0.0"]

[project.scripts]
agent        = "agents.agents:main"
agent-docs   = "agents.tools.docs:main"
agent-memory = "agents.cli.memory_cli:main"
agent-commit = "agents.cli.commit_cli:main"

[tool.setuptools.packages.find]
include = ["agents*"]

[tool.setuptools.package-data]
agents = ["*.yaml", "cli/*.yaml"]
